<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Circle (Optional, keeping it clean) -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="#222" stroke-width="2" />
  
  <!-- The D20 shape stylized as a hexagon/pentagon hybrid for simplicity and impact -->
  <path d="M64 16 L108 45 L96 103 L32 103 L20 45 Z" fill="#1a1a1a" stroke="#00ffff" stroke-width="4" filter="url(#glow)" />
  
  <!-- Cyberpunk Circuitry Lines -->
  <path d="M64 30 L64 70 M40 50 L88 50" stroke="#ff00ff" stroke-width="2" opacity="0.8" />
  <circle cx="64" cy="50" r="3" fill="#ff00ff" />
  <path d="M30 90 L100 90 M50 70 L78 70" stroke="#00ffff" stroke-width="2" opacity="0.8" />
  <circle cx="64" cy="70" r="3" fill="#00ffff" />
  
  <!-- Neon highlights -->
  <path d="M25 45 L103 45" stroke="#ffffff" stroke-width="0.5" opacity="0.3" />
</svg>