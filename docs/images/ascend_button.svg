<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Metallic Gold Gradient -->
    <linearGradient id="gold_metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8860b; stop-opacity:1" />
      <stop offset="30%" style="stop-color:#d4af37; stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f9e076; stop-opacity:1" />
      <stop offset="70%" style="stop-color:#d4af37; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a67c00; stop-opacity:1" />
    </linearGradient>

    <!-- Shadow/Depth filter -->
    <filter id="heavy_shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" opacity="0.6"/>
    </filter>

    <!-- Interior Texture Gradient -->
    <radialGradient id="interior_depth" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#2e0854; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0c29; stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- 1. OUTER HARD BORDER (The Master Frame) -->
  <!-- A thick, heavy ring with nested segments to create a "carved" look -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="url(#gold_metal)" stroke-width="12" />
  <circle cx="200" cy="200" r="185" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4" />
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#gold_metal)" stroke-width="4" />

  <!-- 2. INTERNAL ORNAMENTAL RING (The Mandalas) -->
  <g fill="none" stroke="#d4af37" stroke-width="2" opacity="0.6">
    <circle cx="200" cy="200" r="150" stroke-dasharray="8,4" />
    <circle cx="200" cy="200" r="130" stroke-dasharray="4,2" opacity="0.4" />
  </g>

  <!-- 3. COMPLEX FILIGREE (The Internal Detail) -->
  <!-- This uses many paths to create a web of "carved metal" patterns inside the medallion -->
  <g fill="none" stroke="#d4af37" stroke-width="0.8" opacity="0.5">
    <!-- Cross-hatching and sacred geometry patterns -->
    <path d="M100,200 Q200,50 300,200 T500,400" />
    <path d="M100,200 Q200,350 300,200 T500,50" />
    <circle cx="200" cy="200" r="80" stroke-dasharray="2,2" />
    <path d="M140,140 L260,260 M260,140 L140,260 M200,100 L200,300 M100,200 L300,200" />
    <!-- Smaller internal accents -->
    <circle cx="150" cy="150" r="5" fill="#f9e076" opacity="0.4"/>
    <circle cx="250" cy="250" r="5" fill="#f9e076" opacity="0.4"/>
    <circle cx="150" cy="250" r="5" fill="#f9e076" opacity="0.4"/>
    <circle cx="250" cy="150" r="5" fill="#f9e076" opacity="0.4"/>
  </g>

  <!-- 4. THE CORE (Background) -->
  <circle cx="200" cy="200" r="130" fill="url(#interior_depth)" />

  <!-- 5. TEXT (The Command) -->
  <text
    x="50%"
    y="50%"
    dominant-baseline="middle"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif; Arial, sans-serif"
    font-weight="900"
    font-size="42"
    fill="#ffffff"
    filter="url(#heavy_shadow)"
  >
    ASCEND
  </text>

  <!-- 6. LIGHTING EFFECTS (The "3D" Look) -->
  <ellipse cx="150" cy="150" rx="80" ry="40" fill="white" opacity="0.05" transform="rotate(-20, 150, 150)" />
</svg>
